<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غازي | بورتفوليو تقنية المعلومات</title>
    <!-- تضمين Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: {} }
      }
    </script>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

    <!-- مكان عرض التطبيق -->
    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400">جاري تحميل مكونات البورتفوليو...</p>
            </div>
        </div>
    </div>

    <!-- مكتبات React و Babel لقراءة الأكواد والمكونات مباشرة -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- تجميع وربط المكونات معاً في ملف index.html -->
    <script type="text/babel">
      const { useState } = React;

      // 1. مكون شريط التنقل (Navbar Component)
      function Navbar({ lang, setLang }) {
        return (
          <header className="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
              <span className="font-bold text-emerald-400">GHAZI.IT</span>
              <div className="flex items-center gap-4">
                <button 
                  onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} 
                  className="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-300 transition">
                  {lang === 'ar' ? 'English' : 'عربي'}
                </button>
              </div>
            </div>
          </header>
        );
      }

      // 2. مكون الواجهة الرئيسية (Hero Component)
      function Hero({ lang }) {
        return (
          <section className="min-h-screen flex items-center justify-center pt-20 px-6">
            <div className="max-w-4xl mx-auto text-center">
              <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm mb-6">
                <i class="fa-solid fa-code"></i> {lang === 'ar' ? 'طالب تقنية معلومات ومطور برمجيات' : 'IT Student & Software Developer'}
              </div>
              <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
                {lang === 'ar' ? 'أهلاً بك، أنا ' : 'Welcome, I am '} 
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
                  {lang === 'ar' ? 'غازي محمد' : 'Ghazi Mohammed'}
                </span>
              </h1>
              <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
                {lang === 'ar' 
                  ? 'شاب طموح، أدرس تقنية معلومات وأسعى نحو الحرية المالية والنفسية والتقنية. أبني حلول برمجية ذكية.' 
                  : 'Ambitious IT student striving for financial and technical freedom. Building smart software solutions.'}
              </p>
            </div>
          </section>
        );
      }

      // 3. المكون الرئيس المجمع (App Component) الذي يربط الكل ببعضه
      function App() {
        const [lang, setLang] = useState('ar');

        return (
          <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className="min-h-screen bg-slate-950 text-slate-100">
            <Navbar lang={lang} setLang={setLang} />
            <main>
              <Hero lang={lang} />
            </main>
          </div>
        );
      }

      // تشغيل التطبيق في المتصفح
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
